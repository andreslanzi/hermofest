<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>HERMOFEST // SUBÍ TU CONTENIDO</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BBH+Bartle&family=Michroma&family=Source+Code+Pro:wght@400;600&display=swap">
<style>
  :root{
    --bg:#0a0204; --void:#080204; --ink:#ff5b6a; --mid:#b2122a; --dim:#6b2c36;
    --soft:#e37482; --ice:#ffdae0; --pulse:#b2122a; --pulse-hi:#ff4d5e;
    --disp:"BBH Bartle",Impact,sans-serif; --wide:"Michroma","Arial Black",sans-serif;
    --mono:"Source Code Pro",ui-monospace,monospace;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{
    min-height:100dvh; background:var(--bg); color:var(--ice);
    font-family:var(--mono); overflow-x:hidden;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
    padding:clamp(1.2rem,5vw,2.2rem) 16px calc(2rem + env(safe-area-inset-bottom));
  }
  #rain{ position:fixed; inset:0; z-index:0; opacity:.5; pointer-events:none; }
  .wrap{ position:relative; z-index:1; width:100%; max-width:520px; }
  .brand{
    font-family:var(--wide); font-size:clamp(.7rem,3.4vw,.82rem); letter-spacing:.42em;
    color:var(--pulse-hi); text-transform:uppercase; text-align:center; margin:.4rem 0 0;
  }
  h1{
    font-family:var(--disp); font-weight:400; text-transform:uppercase;
    font-size:clamp(2rem,9vw,3rem); line-height:.9; letter-spacing:.01em;
    white-space:nowrap; max-width:100%;
    text-align:center; margin:.5rem 0 .1rem; color:var(--ink);
    text-shadow:0 0 22px rgba(255,77,110,.45);
  }
  .lead{
    text-align:center; color:var(--soft); font-size:clamp(.82rem,3.6vw,.95rem);
    line-height:1.4; letter-spacing:.02em; margin:.2rem auto 1.6rem; max-width:34ch;
  }
  .actions{ display:flex; flex-direction:column; gap:.8rem; }
  .act{
    display:flex; align-items:center; gap:.9rem; cursor:pointer;
    border:2px solid var(--ink); background:rgba(178,18,42,.10); color:var(--ice);
    padding:1.05em 1.1em; font-family:var(--wide); text-transform:uppercase;
    font-size:clamp(.82rem,3.8vw,1rem); letter-spacing:.06em;
    transition:background .15s, transform .1s, box-shadow .2s;
    box-shadow:4px 4px 0 var(--pulse);
  }
  .act:active{ transform:translate(2px,2px); box-shadow:2px 2px 0 var(--pulse); }
  .act--primary{ background:var(--ink); color:var(--void); }
  .act svg{ width:1.7em; height:1.7em; flex:none; }
  .act input{ display:none; }
  .hint{ text-align:center; color:var(--dim); font-size:.72rem; letter-spacing:.08em; margin-top:1rem; text-transform:uppercase; }

  .queue{ margin-top:1.4rem; display:flex; flex-direction:column; gap:.6rem; }
  .item{
    border:1px solid var(--dim); background:rgba(8,2,4,.6); padding:.7rem .8rem;
    display:flex; flex-direction:column; gap:.45rem;
  }
  .item__top{ display:flex; align-items:center; gap:.6rem; font-size:.78rem; }
  .item__name{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--soft); }
  .item__st{ flex:none; font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; }
  .item.ok .item__st{ color:var(--pulse-hi); }
  .item.err .item__st{ color:#ff8080; }
  .bar{ height:5px; background:var(--dim); overflow:hidden; }
  .bar > i{ display:block; height:100%; width:0; background:linear-gradient(90deg,var(--mid),var(--pulse-hi)); transition:width .2s ease; }
  .item.ok .bar > i{ width:100% !important; }
  .retry{ align-self:flex-start; margin-top:.2rem; background:none; border:1px solid var(--ink); color:var(--ink);
    font-family:var(--mono); font-size:.72rem; letter-spacing:.06em; text-transform:uppercase; padding:.3em .7em; cursor:pointer; }

  .done{
    margin-top:1.4rem; text-align:center; border:2px solid var(--pulse-hi);
    background:rgba(178,18,42,.15); padding:1rem; display:none;
  }
  .done.show{ display:block; animation:pop .3s ease; }
  .done b{ font-family:var(--wide); color:var(--ice); letter-spacing:.1em; font-size:1.05rem; }
  .done span{ display:block; color:var(--soft); font-size:.8rem; margin-top:.3rem; }
  @keyframes pop{ from{ transform:scale(.96); opacity:0 } }

  .foot{ text-align:center; color:var(--dim); font-size:.68rem; letter-spacing:.14em; text-transform:uppercase; margin-top:1.8rem; line-height:1.6; }
  .config-warn{ display:none; margin-top:1rem; text-align:center; color:#ffb0b0; font-size:.75rem; border:1px dashed #ff8080; padding:.6rem; }
</style>
</head>
<body>
<canvas id="rain" aria-hidden="true"></canvas>
<div class="wrap">
  <h1>HERMOFEST</h1>
  <p class="lead">Subí fotos y videos de recuerdo 🔴</p>

  <div class="actions">
    <label class="act act--primary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1Z"/><circle cx="12" cy="13" r="3.2"/></svg>
      <span>Sacar foto</span>
      <input type="file" accept="image/*" capture="environment" data-kind="foto">
    </label>
    <label class="act">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3z"/></svg>
      <span>Grabar video</span>
      <input type="file" accept="video/*" capture="environment" data-kind="video">
    </label>
    <label class="act">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9" r="1.8"/><path d="M4 17l5-4 4 3 3-2 4 3"/></svg>
      <span>Elegir de galería</span>
      <input type="file" accept="image/*,video/*" multiple data-kind="galeria">
    </label>
  </div>

  <div class="config-warn" id="cfgWarn">⚠️ Falta configurar el destino (Cloudinary). Pasame el cloud name + preset.</div>
  <div class="queue" id="queue"></div>

  <div class="done" id="done"><b>¡LISTO! GRACIAS 🔴</b><span>Podés subir más cuando quieras.</span></div>

  <p class="foot">· Desde el sótano ·</p>
</div>

<script>
/* ==== CONFIG: completar con los datos de la cuenta de Cloudinary ==== */
const CLOUD_NAME    = 'pcc6iayd';
const UPLOAD_PRESET = 'hermofest_unsigned';
/* =================================================================== */

const q = document.getElementById('queue');
const doneEl = document.getElementById('done');
const cfgOk = CLOUD_NAME !== 'TU_CLOUD_NAME' && UPLOAD_PRESET !== 'TU_UPLOAD_PRESET';
if (!cfgOk) document.getElementById('cfgWarn').style.display = 'block';

document.querySelectorAll('.act input').forEach(inp => {
  inp.addEventListener('change', () => {
    [...inp.files].forEach(addToQueue);
    inp.value = '';   /* permite volver a elegir el mismo archivo */
  });
});

function fmt(bytes){ return bytes > 1048576 ? (bytes/1048576).toFixed(1)+' MB' : Math.max(1,Math.round(bytes/1024))+' KB'; }

function addToQueue(file){
  const el = document.createElement('div');
  el.className = 'item';
  el.innerHTML = `<div class="item__top"><span class="item__name"></span><span class="item__st">En cola…</span></div><div class="bar"><i></i></div>`;
  el.querySelector('.item__name').textContent = (file.name || 'captura') + ' · ' + fmt(file.size);
  q.appendChild(el);
  start(file, el);
}

function start(file, el){
  const st = el.querySelector('.item__st'), bar = el.querySelector('.bar > i');
  el.classList.remove('err','ok');
  const old = el.querySelector('.retry'); if (old) old.remove();
  if (!cfgOk){ st.textContent = 'Sin configurar'; el.classList.add('err'); return; }
  st.textContent = 'Subiendo…';
  upload(file, p => { bar.style.width = Math.round(p*100)+'%'; })
    .then(() => { el.classList.add('ok'); st.textContent = 'Subido ✓'; showDone(); })
    .catch(() => {
      el.classList.add('err'); st.textContent = 'Falló';
      const r = document.createElement('button'); r.className='retry'; r.textContent='Reintentar';
      r.onclick = () => start(file, el); el.appendChild(r);
    });
}

function upload(file, onProgress){
  return new Promise((res, rej) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/auto/upload`);
    xhr.upload.onprogress = e => { if (e.lengthComputable) onProgress(e.loaded / e.total); };
    xhr.onload = () => (xhr.status >= 200 && xhr.status < 300) ? res(JSON.parse(xhr.responseText)) : rej(new Error('HTTP '+xhr.status));
    xhr.onerror = () => rej(new Error('red'));
    xhr.ontimeout = () => rej(new Error('timeout'));
    const fd = new FormData();
    fd.append('file', file);
    fd.append('upload_preset', UPLOAD_PRESET);
    xhr.send(fd);
  });
}

let doneTimer = null;
function showDone(){
  doneEl.classList.add('show');
  clearTimeout(doneTimer);
  doneTimer = setTimeout(() => doneEl.classList.remove('show'), 4000);
}

/* ── título: achica la fuente si no entra a lo ancho (BBH Bartle es ancha) ── */
(() => {
  const h = document.querySelector('h1'), wrap = document.querySelector('.wrap');
  function fit(){
    h.style.fontSize = '';
    let fs = parseFloat(getComputedStyle(h).fontSize), guard = 0;
    while (h.scrollWidth > wrap.clientWidth && fs > 12 && guard++ < 60){ fs -= 1.5; h.style.fontSize = fs + 'px'; }
  }
  fit();
  addEventListener('resize', fit);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
})();

/* ── lluvia matrix roja de fondo (sutil) ── */
(() => {
  const c = document.getElementById('rain'), x = c.getContext('2d');
  const G = 'アイウエオカキクケコ0123456789'.split('');
  let W, H, cols, drops, fs;
  function size(){ W = c.width = innerWidth; H = c.height = innerHeight; fs = W < 500 ? 14 : 18; cols = Math.ceil(W/fs); drops = Array.from({length:cols}, () => Math.random()*-40); }
  size(); addEventListener('resize', size);
  (function loop(){
    x.fillStyle = 'rgba(10,2,4,0.12)'; x.fillRect(0,0,W,H);
    x.font = fs+'px monospace'; x.textAlign = 'center';
    for (let i=0;i<cols;i++){
      const y = drops[i]*fs;
      if (y>0){ x.fillStyle = Math.random()<0.05 ? '#ffdae0' : '#b2122a'; x.fillText(G[Math.random()*G.length|0], i*fs+fs/2, y); }
      drops[i] += 0.28;
      if (y>H && Math.random()>0.975) drops[i] = Math.random()*-18;
    }
    requestAnimationFrame(loop);
  })();
})();
</script>
</body>
</html>
